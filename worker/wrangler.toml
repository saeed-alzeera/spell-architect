name = "spell-architect-mp"
main = "worker.js"
compatibility_date = "2024-09-23"

# One tiny Durable Object per room code, used only to pass the WebRTC
# handshake between players (public routes under /mp/*).
[[durable_objects.bindings]]
name = "MP"
class_name = "MPRoom"

# Every uploaded run (analytics). Public POST, admin-key GET; see runs.js.
# Secret (not stored here):  wrangler secret put ADMIN_KEY
[[durable_objects.bindings]]
name = "RUNS"
class_name = "RunStore"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["MPRoom"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["RunStore"]
