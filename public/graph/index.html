<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spell Architect systems map</title>
<meta name="description" content="Developer reference: every system, rune, enemy and relic in Spell Architect as a mind map, with open design issues marked.">
<style>
  :root {
    --bg: #ffffff; --panel: #f6f7f9; --line: #d5d9e0; --ink: #1a1d23; --muted: #5b6370;
    --accent: #1a1d23; --feed: #15803d; --bal: #1d4ed8; --reinf: #c2410c; --issue: #c81e3a; --warn: #b45309;
    --issue-bg: #fdecef; --warn-bg: #fdf3e2; --btn-on: #e3e7ee;
    --font: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font: 15px/1.5 var(--font); }
  body { display: grid; grid-template-rows: auto 1fr; overflow: hidden; }
  header { padding: 10px 16px; border-bottom: 1px solid var(--line); background: var(--panel); display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; }
  header h1 { font-size: 16px; margin: 0; font-weight: 650; white-space: nowrap; }
  .ctl { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
  .ctl .lab { color: var(--muted); font-size: 13px; }
  button, input { font: inherit; font-size: 14px; color: var(--ink); background: #fff; border: 1px solid #b8bec9; border-radius: 6px; padding: 5px 11px; }
  button { cursor: pointer; }
  button:hover { background: var(--btn-on); }
  input:focus, button:focus-visible { outline: 2px solid var(--bal); outline-offset: 1px; }
  button[aria-pressed="true"], button.on { background: var(--btn-on); border-color: var(--ink); font-weight: 600; }
  input { width: 220px; }
  .notes textarea { width: 100%; min-height: 110px; resize: vertical; font: inherit; font-size: 14px; padding: 8px; border: 1px solid #b8bec9; border-radius: 6px; background: #fff; color: var(--ink); }
  .notes .st { color: var(--muted); font-size: 12px; margin-top: 4px; }
  .notes details { margin-top: 8px; font-size: 13px; color: var(--muted); }
  .notes input { width: 100%; margin-top: 6px; }
  main { display: grid; grid-template-columns: 1fr 360px; min-height: 0; }
  #stage { position: relative; overflow: hidden; cursor: grab; touch-action: none; background: var(--bg); }
  #stage.drag { cursor: grabbing; }
  #count { position: absolute; left: 12px; bottom: 10px; color: var(--muted); font-size: 13px; pointer-events: none; }
  svg { width: 100%; height: 100%; display: block; }
  aside { border-left: 1px solid var(--line); background: var(--panel); padding: 16px; overflow-y: auto; }
  aside h2 { font-size: 18px; margin: 0 0 6px; }
  aside .file { color: var(--muted); font-size: 13px; margin-bottom: 8px; word-break: break-word; }
  aside h3 { font-size: 13px; font-weight: 650; color: var(--muted); margin: 16px 0 6px; }
  aside p { margin: 8px 0; }
  aside ul { margin: 0; padding-left: 20px; }
  aside li { margin: 4px 0; }
  aside .sub { color: var(--muted); font-size: 13px; font-weight: 400; }
  .issue { border-left: 4px solid var(--issue); background: var(--issue-bg); padding: 8px 10px; border-radius: 4px; margin-top: 10px; }
  .issue.warn { border-color: var(--warn); background: var(--warn-bg); }
  .issue b { display: block; font-size: 13px; margin-bottom: 3px; }
  .lk { cursor: pointer; text-decoration: underline; text-decoration-color: #9aa3b2; text-underline-offset: 2px; }
  .lk:hover { text-decoration-color: currentColor; }
  .tag { display: inline-block; font-size: 11px; padding: 1px 6px; border-radius: 3px; margin-right: 5px; color: #fff; font-weight: 600; }
  .legend { display: grid; gap: 6px; font-size: 14px; }
  .legend span.sw { display: inline-block; width: 24px; height: 0; border-top: 3px solid; vertical-align: middle; margin-right: 8px; }
  .legend span.dot { display: inline-block; width: 11px; height: 11px; border-radius: 50%; vertical-align: middle; margin: 0 8px 0 6px; }
  .node rect { stroke-width: 1.5; }
  .node text { fill: var(--ink); font-size: 14px; pointer-events: none; font-family: var(--font); }
  .node .sub { fill: var(--muted); font-size: 12px; }
  .node.d1 text, .node.d0 text { font-weight: 650; }
  .node { cursor: pointer; transition: opacity .15s; }
  .node.dim, .edge.dim { opacity: .3; }
  .node.sel rect { stroke: #000; stroke-width: 3; }
  .node.hit rect { stroke: #000; stroke-width: 2.5; }
  .edge { fill: none; stroke-linecap: round; }
  .flow { fill: none; stroke-width: 2; stroke-dasharray: 7 4; opacity: .95; }
  .flow-label { font: 600 12px var(--font); paint-order: stroke; stroke: #fff; stroke-width: 4px; }
  .badge { font-size: 14px; font-weight: 800; font-family: var(--font); }
  @media (max-width: 760px) {
    main { grid-template-columns: 1fr; grid-template-rows: 1fr 40%; }
    aside { border-left: 0; border-top: 1px solid var(--line); }
    input { width: 140px; }
  }
</style>
</head>
<body>
<header>
  <h1>Spell Architect systems map</h1>
  <span id="ver" class="lab" style="font-size:13px;color:var(--muted)"></span>
  <div class="ctl"><span class="lab">Show depth:</span>
    <button data-depth="1">1</button><button data-depth="2">2</button><button data-depth="3">3</button><button data-depth="9">All</button>
  </div>
  <div class="ctl">
    <input id="q" type="search" placeholder="Search nodes…" autocomplete="off">
    <button id="bIssues" aria-pressed="false">Issues only</button>
    <button id="bFit">Fit</button>
  </div>
  </header>
<main>
  <div id="stage"><svg id="svg"><defs>
    <marker id="arF" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#15803d"/></marker>
    <marker id="arR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#c2410c"/></marker>
    <marker id="arB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#1d4ed8"/></marker>
  </defs><g id="vp"><g id="gEdges"></g><g id="gNodes"></g><g id="gFlows"></g></g></svg><div id="count"></div></div>
  <aside id="info"></aside>
</main>
<script>
/* Hand-maintained map of what is in the game. Structure: concept → group → item. Keep it in step with src/ when content is added.
   Node fields: id, label, sub (short tag shown on the node), desc, file, rar (rarity dot), cursed, issue {sev:'high'|'warn', text},
   inputs/outputs (lists), c (children). FLOWS below are the cross-links between nodes. */
/* Game version this map was last brought up to date with. Must equal package.json "version"
   (enforced by tools/check-graph.mjs). Set it only after the nodes below reflect that version. */
const GRAPH_SYNCED_VERSION = '1.3.0';
document.getElementById('ver').textContent = 'synced to game v' + GRAPH_SYNCED_VERSION;
const RC = { common: '#8a94a8', uncommon: '#16a34a', rare: '#2563eb', epic: '#9333ea', legendary: '#d97706' };
const L = (id, label, sub, desc, o) => Object.assign({ id, label, sub, desc }, o);   // leaf
const RU = (id, label, rar, sub, desc, o) => L(id, label, sub, desc, Object.assign({ rar }, o)); // rune / relic leaf

const TREE = {
  id: 'root', label: 'Spell Architect', sub: '20 rounds', file: 'src/game/run.ts',
  desc: 'Top-down Survivors-style roguelite. 20 rounds of 45 s with a boss every 5th. Spells are built from runes in a node editor between rounds. Kill enemies for XP and coins, rewire, survive a denser, tougher horde.',
  c: [
  /* ============================== SPELLS ============================== */
  { id: 'spells', label: 'Spells', sub: 'build system', file: 'src/core/spell.ts, src/data/runes.ts',
    desc: 'Runes wired Core → Form → Behaviors / Modifiers / Triggers. checkAttach() is the single source of attachment rules; the compiler produces the CompiledSpell used by casting.',
    inputs: ['Runes (shop, chests, caches)', 'Capacity and slot upgrades'], outputs: ['Compiled spells → Damage'],
    c: [
      { id: 'cores', label: 'Cores', sub: '6 + Arcane', desc: 'Socketed into a Form to give it an element (damage multiplier and cooldown). No Core = Arcane 1.0×, never resisted. Six copies of one Core forge its evolved version.', c: [
        RU('c_fire', 'Fire', 'common', 'cost 2 · 1.3×', 'Burning and explosive damage. Burning enemies take damage over time, spread fire to neighbours and ignite poison clouds. Projectiles explode on impact.'),
        RU('c_ice', 'Ice', 'common', 'cost 2 · 1.25×', 'Chills enemies; three chills freeze them solid, frozen enemies take bonus damage. Wet enemies freeze instantly.'),
        RU('c_lightning', 'Lightning', 'uncommon', 'cost 2 · 1.15× · cd 0.85', 'Fast casts, extra crit chance (+12%) and random arcs. Electrifies puddles; +50% damage on wet enemies.'),
        RU('c_poison', 'Poison', 'uncommon', 'cost 2 · 0.85×', 'Stacking poison that ignores armor and spreads to neighbours on death. Leaves clouds that fire can detonate.'),
        RU('c_water', 'Water', 'common', 'cost 1 · 0.8× · cd 0.9', 'Makes enemies Wet and leaves puddles. Wet enemies freeze faster and conduct lightning.'),
        RU('c_gravity', 'Gravity', 'rare', 'cost 3 · 1.0× · cd 1.25', 'Pulls enemies into tight groups. Gravity wells collapse for bonus damage when they expire.'),
        L('arcane', 'Arcane (no Core)', '1.0×', 'Raw magic with no status effect. Never resisted by bosses.'),
      ] },
      { id: 'evolved', label: 'Evolved Cores', sub: '6', desc: 'Forged in the editor from 6 copies of a base Core (Forgemaster\'s Hammer: 2 fewer). Each gives +40% damage, a passive and an Ultimate. Cost 3, epic.', c: [
        RU('e_fire', 'Inferno', 'epic', 'Fire · Meteor Storm', '+40% damage, bigger explosions, burning enemies erupt when they die.'),
        RU('e_ice', 'Glacier', 'epic', 'Ice · Absolute Zero', '+40% damage, longer freezes, frozen enemies shatter.'),
        RU('e_lightning', 'Tempest', 'epic', 'Lightning · Thunderstorm', '+40% damage, +2 chain jumps, crits release extra arcs.'),
        RU('e_poison', 'Pestilence', 'epic', 'Poison · Plague Wave', '+40% damage, deeper stacks, wider infection, toxic blooms.'),
        RU('e_water', 'Tsunami', 'epic', 'Water · Tidal Surge', '+40% damage, huge long-lasting puddles, stronger conduction.'),
        RU('e_gravity', 'Singularity', 'epic', 'Gravity · Event Horizon', '+40% damage, stronger pull, double collapse damage.'),

        RU('t_hit', 'On Hit', 'common', 'cost 1 · 20/45/60/80%', 'When the form hits an enemy, every effect below activates at the impact point.'),
        RU('t_kill', 'On Kill', 'uncommon', 'cost 1 · 20/45/60/80%', 'When this spell kills an enemy (including by burn or poison), connected branches activate where it died.'),
        RU('t_expiry', 'On Expiry', 'uncommon', 'cost 1 · always', 'When the form ends (timeout, spent or detonated), the effects below activate at its final position.'),
        RU('t_crit', 'On Critical Hit', 'rare', 'cost 1 · 20/45/60/80%', 'When this spell lands a critical hit, connected branches activate.'),

      { id: 'mods', label: 'Modifiers', sub: '6', desc: 'Numeric tweaks to a Form. Most stack up to 3.', c: [

        RU('m_acc', 'Accelerate', 'common', 'cost 1 · max 3', '+40% speed.'),

        RU('m_cooldown', 'Reduce Cooldown', 'uncommon', 'cost 2 · max 3', '−20% cooldown on this spell (multiplicative, 0.8ⁿ).'),

      { id: 'cap', label: 'Capacity & slots', desc: 'Every rune costs capacity (12 per spell to start). Shop upgrade Capacity +2 targets one spell; slots start at 3 and go to 5.',

        L('capCost', 'Capacity', '12 per spell', 'Sum of rune costs in a spell may not exceed its capacity. Gambler\'s Dice adds +1 per Trigger.'),
        L('slots', 'Spell slots', '3 → 5', 'Extra slots cost 18 / 34 / 60 coins.'),
      ] },
    ] },

  /* ============================== DAMAGE ============================== */
  { id: 'damage', label: 'Damage', sub: 'combat pipeline', file: 'src/game/combat.ts, casting.ts',
    desc: 'dealDamage(): resistances → relic multipliers → status bonuses → armor → crit → kill. Every hit can queue trigger events.',
    inputs: ['Compiled spells', 'Player stats (dmgMul, cdMul, crit)', 'Relic and mutation multipliers', 'Enemies from the director'], outputs: ['Kills (XP, coins, drops)', 'Per-spell stats → Mutations'],
    c: [
      { id: 'elements', label: 'Elements', sub: '6 + Arcane (+ Necromancy planned)', desc: 'Each element has a damage multiplier, cooldown factor and set of statuses. Names of each Form change per element (Fireball, Frost Ray, Tesla Mine…).', c: [
        L('elFire', 'Fire', 'burn', 'Burns for damage over time, spreads to neighbours, ignites poison clouds. Dowsed by Water.'),
        L('elIce', 'Ice', 'chill → freeze', 'Chills and slows. Three chills freeze; wet enemies freeze at once. Frozen enemies take +25% damage.'),
        L('elLightning', 'Lightning', 'arcs, crits', 'Fast, crit-prone, arcs to nearby enemies. Devastating on wet foes.'),
        L('elPoison', 'Poison', 'stacks', 'Stacking poison that ignores armor and spreads on death. Leaves flammable clouds.'),
        L('elWater', 'Water', 'wet, puddles', 'Soaks enemies and leaves puddles that slow and conduct electricity.'),
        L('elGravity', 'Gravity', 'pull, collapse', 'Pulls enemies together; wells collapse for extra damage when they end.'),
        L('elArcane', 'Arcane', 'none', 'No Core: raw magic, no status, never resisted.'),
        L('elNecro', 'Necromancy', 'planned', 'Placeholder, intentionally empty: not in the game yet. Details to be filled in by the designer. Not in code, so adding it later means a new Element, a Core rune, statuses, reactions and boss resistances.'),

      { id: 'status', label: 'Statuses', sub: '6', desc: 'Timed effects on an enemy, applied by elements.', c: [

        L('sFreeze', 'Frozen', 'immobile', 'Cannot move or act; +25% damage taken. Grants freeze immunity afterwards. Bosses cannot be frozen.'),

        L('sPulled', 'Pulled', 'gravity', 'Dragged toward a well. Counted for the Collapsing Star mutation.'),
      ] },
      { id: 'react', label: 'Reactions', sub: '11', desc: 'Emerge from simple rules in combat.ts. Damage is split evenly across both elements, so an enemy resisting one still takes the other.',

        L('rElectrify', 'Electrified Puddle', 'lightning + water', 'Lightning hitting a puddle shocks everything inside every 0.4 s for ~4 s, and nearby puddles too.'),
        L('rConduct', 'Conduction', 'lightning + wet enemy', '+50% lightning damage on a wet enemy, arcs to 2 other wet enemies.'),
        L('rGas', 'Gas Explosion', 'fire + poison cloud', 'The cloud detonates for fire + poison damage and sets enemies alight. Chains to nearby clouds.'),

      ] },
      { id: 'crit', label: 'Crits', sub: '5% · ×1.8', desc: 'Base 5% chance, ×1.8 damage. Lightning +12%, Overcharge +20%, Keen Eye +5%, Keen Edge +3%, Brutal Strikes +30% damage. Deliberately uncapped: artificial limits feel bad to a player who has built toward them.' },

      { id: 'stack', label: 'Multiplier stack', sub: 'multiplicative', desc: 'Everything below multiplies together.',
        issue: { sev: 'high', text: 'About six systems multiply together. Quick-mode win: 615k damage, 89% from one spell. Group bonuses into additive buckets.' }, c: [

      /* ---- enemies live under damage: they are what damage is dealt to ---- */
      { id: 'enemies', label: 'Enemies', sub: '5 + elites + 12 bosses', file: 'src/game/enemies.ts, bosses.ts',
        desc: 'What damage is dealt to. HP and damage scale with the director clock (see Run); armor grows with time. Each enemy hunts the nearest living player.',
        outputs: ['Contact and projectile damage → Health', 'Kills → XP, coins, hearts, chests'], c: [
        { id: 'arch', label: 'Archetypes', sub: '5', desc: 'Base stats before time scaling. Swarmers + grunts were 78% of damage taken.', c: [

          { id: 'archer', label: 'Archer', sub: '16 hp · spd 105 · dmg 10', desc: 'Appears from ~round 2. Keeps 200–280 px away and strafes; a 0.6 s wind-up, then a bullet at 230 px/s every 2.6–3.6 s. 30% coin drop, 2 XP.', c: [
          ] },
          { id: 'charger', label: 'Charger', sub: '36 hp · spd 140 · dmg 15', desc: 'Appears from ~round 4. Telegraphed 0.75 s wind-up, then dashes at 820 px/s for 0.55 s. 30% coin drop, 2.5 XP. Mines are strong against it.' },

        { id: 'elites', label: 'Elites', sub: 'from round 4', desc: 'Any non-boss archetype with ×6 HP and XP, ×1.3 damage and radius, ×1.4 scale. Spawn at 55% of a round from round 4 (count rises with rounds). Pool widens with time. Drops: 3 coins always, 45% heart, 30% cache (round 2+), 12% relic (round 4+). Which archetypes appear depends on the clock: see the pool below.', c: [

const COLORS = { F: '#15803d', R: '#c2410c', B: '#1d4ed8' };
const MARK = { F: 'url(#arF)', R: 'url(#arR)', B: 'url(#arB)' };
const NAMES = { F: 'flow', R: 'reinforcing', B: 'balancing' };
const BRANCH = ['#7c3aed', '#c2410c', '#2563eb', '#15803d', '#be185d', '#a16207', '#0e7490', '#6d28d9', '#4d7c0f', '#b91c1c', '#4338ca'];
const GAPX = 48, ROWH = 32, NODEH = 26;

const byId = {};
let total = 0;
(function index(n, p, d) {
  n.children = n.c || []; n.parent = p; n.depth = d; n.open = d < 2; byId[n.id] = n; total++;
  if (d === 1) n.col = BRANCH[(p.children.indexOf(n)) % BRANCH.length]; else if (d > 1) n.col = p.col; else n.col = '#1a1d23';
  n.children.forEach((c) => index(c, n, d + 1));
})(TREE, null, 0);
const all = Object.values(byId);
const ctx = document.createElement('canvas').getContext('2d');
const FONT = getComputedStyle(document.documentElement).getPropertyValue('--font');
const textW = (str, px, weight) => { ctx.font = `${weight} ${px}px ${FONT}`; return ctx.measureText(str).width; };
for (const n of all) {
  const bold = n.depth <= 1 ? 650 : 400;
  const t = textW(n.label, 14, bold) + (n.sub ? textW(n.sub, 12, 400) + 10 : 0) + 20 + (n.children.length && n.depth > 0 ? 22 : 0) + (n.rar || n.cursed ? 12 : 0) + (n.issue ? 14 : 0);
  n.w = Math.ceil(n.depth === 0 ? Math.max(170, t + 12) : t); n.h = n.depth === 0 ? 40 : NODEH;
}

const svg = document.getElementById('svg'), vp = document.getElementById('vp');
const gE = document.getElementById('gEdges'), gF = document.getElementById('gFlows'), gN = document.getElementById('gNodes');
const info = document.getElementById('info'), countEl = document.getElementById('count');
let sel = null, showIssues = false, query = '', matches = null, saved = null;
const view = { x: 0, y: 0, k: 1 };
const NS = 'http://www.w3.org/2000/svg';
const el = (t, a, parent) => { const e = document.createElementNS(NS, t); for (const k in a) e.setAttribute(k, a[k]); if (parent) parent.appendChild(e); return e; };

/** Visible node, walking up to the nearest folded ancestor (so links to hidden nodes attach to the visible parent). */
function shown(n) { let v = n; for (let p = n.parent; p; p = p.parent) if (!p.open) v = p; return v; }
const hasIssueBelow = (n) => n.children.some((c) => c.issue || hasIssueBelow(c));
const leaves = (n) => (n.children.length ? n.children.reduce((s, c) => s + leaves(c), 0) : 1);
const isAnc = (a, n) => { for (let p = n.parent; p; p = p.parent) if (p === a) return true; return false; };

/* ---- layout: root in the middle, concepts split over a right and a left half, each laid out as a tidy tree ---- */
function layout() {
  const root = TREE, kids = root.children, tot = kids.reduce((s, c) => s + leaves(c), 0);
  let acc = 0; const right = [], left = [];
  for (const c of kids) { (acc + leaves(c) / 2 <= tot / 2 ? right : left).push(c); acc += leaves(c); }
  left.reverse(); // read clockwise: down the right, back up the left
  root.x = -root.w / 2; root.y = 0;
  for (const [side, list] of [[1, right], [-1, left]]) {
    const colW = [];
    const measure = (n) => { colW[n.depth] = Math.max(colW[n.depth] || 0, n.w); if (n.open) n.children.forEach(measure); };
    list.forEach(measure);
    const ix = [0, root.w / 2 + 40];
    for (let d = 1; d < colW.length; d++) ix[d + 1] = ix[d] + (colW[d] || 0) + GAPX;
    let row = 0;
    const placed = [];
    const place = (n) => {
      placed.push(n); n.side = side;
      n.x = side > 0 ? ix[n.depth] : -ix[n.depth] - n.w;
      const ks = n.open ? n.children : [];
      if (!ks.length) { n.y = row++ * ROWH; return; }
      ks.forEach(place);
      n.y = (ks[0].y + ks[ks.length - 1].y) / 2;
    };
    list.forEach(place);
    const off = ((row - 1) * ROWH) / 2;
    for (const n of placed) n.y -= off;
  }
}
function visible() { const out = []; (function w(n) { out.push(n); if (n.open) n.children.forEach(w); })(TREE); return out; }

function related() {
  const s = new Set();
  if (!sel) return s;
  s.add(sel);
  for (let p = sel.parent; p; p = p.parent) s.add(p);
  (function d(n) { n.children.forEach((c) => { s.add(c); d(c); }); })(sel);
  for (const [a, b] of FLOWS) { const A = byId[a], B = byId[b]; if (A === sel || isAnc(sel, A) || shown(A) === sel) s.add(shown(B)); if (B === sel || isAnc(sel, B) || shown(B) === sel) s.add(shown(A)); }
  return s;
}

function render() {
  layout();
  gE.textContent = ''; gN.textContent = ''; gF.textContent = '';
  const nodes = visible(), rel = related();
  const dimNode = (n) => (matches && !matches.has(n) && !matches.anc.has(n)) || (showIssues && !n.issue && !(n.children.length && hasIssueBelow(n)) && !(n.depth === 0)) || (sel && !rel.has(n));

  for (const n of nodes) if (n.parent) {
    const p = n.parent, s = n.side;
    const x1 = p.depth === 0 ? s * p.w / 2 : (s > 0 ? p.x + p.w : p.x), y1 = p.y, x2 = s > 0 ? n.x : n.x + n.w, y2 = n.y, mx = (x1 + x2) / 2;
    el('path', { d: `M${x1},${y1}C${mx},${y1} ${mx},${y2} ${x2},${y2}`, class: 'edge' + (dimNode(n) ? ' dim' : ''), stroke: n.col, 'stroke-width': Math.max(1.2, 4.2 - n.depth * 0.9), 'stroke-opacity': n.depth > 2 ? 0.7 : 0.95 }, gE);
  }

  /* Cross-links (FLOWS) are listed in the sidebar only; drawing them over the map made it unreadable. */

  for (const n of nodes) {
    const g = el('g', { class: `node d${Math.min(n.depth, 2)}` + (dimNode(n) ? ' dim' : '') + (n === sel ? ' sel' : '') + (matches && matches.has(n) ? ' hit' : ''), transform: `translate(${n.x},${n.y - n.h / 2})`, tabindex: 0 }, gN);
    const strong = n.depth <= 1;
    const stroke = n.issue ? (n.issue.sev === 'high' ? '#c81e3a' : '#b45309') : n.col;
    el('rect', { width: n.w, height: n.h, rx: n.depth === 0 ? 18 : strong ? 11 : 6, fill: n.depth === 0 ? '#1a1d23' : strong ? n.col + '1f' : '#ffffff', stroke, 'stroke-opacity': n.depth > 2 ? 0.75 : 1 }, g);
    let tx = 10;
    if (n.rar || n.cursed) { el('circle', { cx: 11, cy: n.h / 2, r: 3.6, fill: n.cursed ? '#c81e3a' : RC[n.rar] }, g); tx = 21; }
    const t = el('text', { x: tx, y: n.h / 2 + 5 }, g);
    t.textContent = n.label;
    if (n.sub) { const s = el('tspan', { class: 'sub', dx: 8 }, t); s.textContent = n.sub; }
    if (n.depth === 0) t.setAttribute('x', 16), t.style.fill = '#ffffff';
    if (n.issue) { const b = el('text', { x: n.w - (n.children.length ? 34 : 14), y: n.h / 2 + 5, class: 'badge', style: `fill:${n.issue.sev === 'high' ? '#c81e3a' : '#b45309'}` }, g); b.textContent = '!'; }
    else if (!n.open && hasIssueBelow(n)) el('circle', { cx: n.w - 30, cy: n.h / 2, r: 3, fill: '#c81e3a' }, g);
    if (n.children.length && n.depth > 0) {
      const tg = el('g', { transform: `translate(${n.w - 12},${n.h / 2})` }, g);
      el('circle', { r: 8, fill: '#ffffff', stroke: n.col, 'stroke-width': 1.5 }, tg);
      const tt = el('text', { x: 0, y: 4.5, 'text-anchor': 'middle', style: 'font-size:13px;font-weight:700' }, tg); tt.textContent = n.open ? '−' : '+';
    }
    g.addEventListener('click', (ev) => { ev.stopPropagation(); activate(n); });
    g.addEventListener('keydown', (ev) => { if (ev.key === 'Enter') activate(n); });
  }
  countEl.textContent = `${nodes.length} of ${total} nodes shown`;
  applyView();
}

/** Click: select the node and fold or unfold it, keeping it where it was on screen. */
function activate(n) {
  const wasSel = sel === n;
  sel = wasSel && !n.children.length ? null : n;
  if (n.children.length && n.depth > 0) {
    const sx = n.x * view.k + view.x, sy = n.y * view.k + view.y;
    n.open = !n.open;
    layout();
    view.x = sx - n.x * view.k; view.y = sy - n.y * view.k;
  }
  render(); panel();
}

function reveal(n) { for (let p = n.parent; p; p = p.parent) p.open = true; }

function flowList(n, dir) {
  return FLOWS.filter(([a, b]) => (dir === 'out' ? a : b) === n.id).map(([a, b, l, t]) => ({ other: byId[dir === 'out' ? b : a], label: l, t }));
}

/* ---- notes: written here, kept in this browser, and synced to the worker (/runs/notes) when a sync key is set ---- */
const NOTE_API = 'https://spell-architect-mp.saeed-a-alzeera.workers.dev/runs/notes';
const lsGet = (k) => { try { return localStorage.getItem(k); } catch { return null; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, v); } catch { /* private mode */ } };
let NOTES = {}; try { NOTES = JSON.parse(lsGet('sa-graph-notes') || '{}'); } catch { NOTES = {}; }
const GENERAL = '_general';
const noteKey = () => lsGet('sa-graph-key') || '';
function noteLabel(id) { return id === GENERAL ? 'General' : (byId[id] ? byId[id].label : id); }

async function pullNotes() {
  const key = noteKey(); if (!key) return;
  try {
    const r = await fetch(NOTE_API, { headers: { Authorization: 'Bearer ' + key } });
    if (!r.ok) return;
    for (const n of (await r.json()).notes) if (!NOTES[n.id] || NOTES[n.id].at < n.at) NOTES[n.id] = { text: n.text, at: n.at };
    lsSet('sa-graph-notes', JSON.stringify(NOTES)); panel();
  } catch { /* offline: local notes still work */ }
}
async function pushNote(id, status) {
  const key = noteKey();
  if (!key) { status.textContent = 'Saved in this browser only. Add the sync key below to sync.'; return; }
  try {
    const r = await fetch(NOTE_API, { method: 'POST', headers: { Authorization: 'Bearer ' + key, 'Content-Type': 'application/json' }, body: JSON.stringify({ id, text: (NOTES[id] || {}).text || '' }) });
    status.textContent = r.ok ? 'Synced' : r.status === 401 ? 'Not synced: wrong sync key' : 'Not synced (' + r.status + ')';
  } catch { status.textContent = 'Not synced: offline. Saved in this browser.'; }
}
function notesBox(id) {
  return `<div class="notes"><h3>Notes${id === GENERAL ? '' : ' on ' + noteLabel(id)}</h3>
    <textarea id="noteText" placeholder="${id === GENERAL ? 'Notes about the game or this map…' : 'Notes on this node…'}"></textarea>
    <div class="st" id="noteSt"></div>
    <details${noteKey() ? '' : ' open'}><summary>Sync key</summary><input id="noteKey" type="password" placeholder="Paste the worker ADMIN_KEY" autocomplete="off"></details></div>`;
}
function wireNotes(id) {
  const ta = document.getElementById('noteText'), st = document.getElementById('noteSt'), ki = document.getElementById('noteKey');
  if (!ta) return;
  ta.value = (NOTES[id] || {}).text || '';
  ki.value = noteKey();
  let timer = 0;
  ta.addEventListener('input', () => {
    const text = ta.value.trim();
    if (text) NOTES[id] = { text, at: Date.now() }; else delete NOTES[id];
    lsSet('sa-graph-notes', JSON.stringify(NOTES));
    st.textContent = 'Saving…'; clearTimeout(timer);
    timer = setTimeout(() => { if (!text) NOTES[id] = { text: '', at: Date.now() }; pushNote(id, st); if (!text) delete NOTES[id]; }, 800);
  });
  ki.addEventListener('change', () => { lsSet('sa-graph-key', ki.value.trim()); st.textContent = 'Key saved'; pullNotes(); });
}

function panel() {
  const n = sel;
  const sev = (x) => (x.issue.sev === 'high' ? 'var(--issue)' : 'var(--warn)');
  if (!n) {
    const issues = all.filter((x) => x.issue).sort((a, b) => (a.issue.sev === 'high' ? 0 : 1) - (b.issue.sev === 'high' ? 0 : 1));
    info.innerHTML = `<h2>How to use</h2>
      <p>The centre is the whole game. Each step outward is more specific, down to single runes, enemies and relics. Click a node to select it and open or close its branch. Drag to pan, scroll or pinch to zoom.</p>
      <div class="legend">
        <div><span class="sw" style="border-color:var(--issue)"></span>Red outline: design fault</div>
        <div><span class="sw" style="border-color:var(--warn)"></span>Orange outline: watch / unverified</div>
        <div><span class="sw" style="border-color:var(--reinf)"></span>Link: reinforcing</div>
        <div><span class="sw" style="border-color:var(--bal)"></span>Link: balancing</div>
        <div><span class="sw" style="border-color:var(--feed)"></span>Link: plain flow</div>
        <div>Rarity:${Object.entries(RC).map(([k, v]) => `<span class="dot" style="background:${v}"></span>${k}`).join('')}</div>
      </div>
      <p class="sub">Depth buttons fold the whole map to a level. Search opens every branch that matches. Select a node to see its cross-links listed here.</p>
      <h3>Open issues</h3><ul>${issues.map((x) => `<li><span class="lk" data-id="${x.id}" style="color:${sev(x)}">${x.label}</span></li>`).join('')}</ul>
      ${notesBox(GENERAL)}
      ${Object.keys(NOTES).filter((k) => k !== GENERAL && byId[k]).length ? `<h3>Nodes with notes</h3><ul>${Object.keys(NOTES).filter((k) => k !== GENERAL && byId[k]).map((k) => `<li><span class="lk" data-id="${k}">${byId[k].label}</span> <span class="sub">${NOTES[k].text.slice(0, 60).replace(/</g, '&lt;')}</span></li>`).join('')}</ul>` : ''}`;
  } else {
    const li = (arr) => arr.map((s) => `<li>${s}</li>`).join('');
    const fl = (arr) => arr.map((f) => `<li><span class="tag" style="background:${COLORS[f.t]}">${NAMES[f.t]}</span><span class="lk" data-id="${f.other.id}">${f.other.label}</span>: ${f.label}</li>`).join('');
    const outs = flowList(n, 'out'), ins = flowList(n, 'in');
    const path = []; for (let p = n.parent; p; p = p.parent) path.unshift(`<span class="lk" data-id="${p.id}">${p.label}</span>`);
    info.innerHTML = `<div class="file">${path.join(' › ') || 'root'}</div><h2>${n.label}${n.sub ? ` <span class="sub">${n.sub}</span>` : ''}</h2>
      ${n.rar ? `<div class="file"><span class="tag" style="background:${RC[n.rar]}">${n.rar}</span>${n.cursed ? '<span class="tag" style="background:#c81e3a">cursed</span>' : ''}</div>` : ''}
      ${n.file ? `<div class="file">${n.file}</div>` : ''}
      <p>${n.desc || ''}</p>
      ${n.issue ? `<div class="issue ${n.issue.sev === 'high' ? '' : 'warn'}"><b>${n.issue.sev === 'high' ? 'Design fault' : 'Watch'}</b>${n.issue.text}</div>` : ''}
      ${n.inputs ? `<h3>Takes in</h3><ul>${li(n.inputs)}</ul>` : ''}
      ${n.outputs ? `<h3>Gives out</h3><ul>${li(n.outputs)}</ul>` : ''}
      ${ins.length ? `<h3>Links in</h3><ul>${fl(ins)}</ul>` : ''}
      ${outs.length ? `<h3>Links out</h3><ul>${fl(outs)}</ul>` : ''}
      ${n.children.length ? `<h3>Contains (${n.children.length})</h3><ul>${n.children.map((c) => `<li><span class="lk" data-id="${c.id}">${c.label}</span>${c.sub ? ` <span class="sub">${c.sub}</span>` : ''}${c.issue ? ' <span style="color:var(--issue)">!</span>' : ''}</li>`).join('')}</ul>` : ''}
      ${notesBox(n.id)}`;
  }
  info.querySelectorAll('.lk').forEach((a) => a.addEventListener('click', () => go(byId[a.dataset.id])));

}

/** Jump to a node from the panel: open its path, select it and centre it. */
function go(t) { reveal(t); sel = t; render(); panel(); focusOn(t); }

/* ---- pan & zoom ---- */
function applyView() { vp.setAttribute('transform', `translate(${view.x},${view.y}) scale(${view.k})`); }
function bounds() { let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9; for (const n of visible()) { x0 = Math.min(x0, n.x); x1 = Math.max(x1, n.x + n.w); y0 = Math.min(y0, n.y - n.h / 2); y1 = Math.max(y1, n.y + n.h / 2); } return { x0, y0, x1, y1 }; }
function fit() {
  layout();
  const r = svg.getBoundingClientRect(), b = bounds(), pad = 30;
  view.k = Math.min(1.3, Math.max(0.05, Math.min((r.width - pad * 2) / (b.x1 - b.x0), (r.height - pad * 2) / (b.y1 - b.y0))));
  view.x = pad - b.x0 * view.k + Math.max(0, (r.width - pad * 2 - (b.x1 - b.x0) * view.k) / 2);
  view.y = pad - b.y0 * view.k + Math.max(0, (r.height - pad * 2 - (b.y1 - b.y0) * view.k) / 2);
  applyView();
}
function focusOn(n) { const r = svg.getBoundingClientRect(); view.k = Math.max(view.k, 0.8); view.x = r.width / 2 - (n.x + n.w / 2) * view.k; view.y = r.height / 2 - n.y * view.k; applyView(); }
const stage = document.getElementById('stage');
const ptrs = new Map(); let pinch = null, moved = false;
// No pointer capture: it would retarget the click away from the node under the pointer.
stage.addEventListener('pointerdown', (e) => { ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY }); moved = false; if (ptrs.size === 2) { const [a, b] = [...ptrs.values()]; pinch = { d: Math.hypot(a.x - b.x, a.y - b.y), k: view.k }; } });
window.addEventListener('pointermove', (e) => {
  const p = ptrs.get(e.pointerId); if (!p) return;
  const dx = e.clientX - p.x, dy = e.clientY - p.y;
  if (!moved && Math.hypot(dx, dy) < 4) return;
  moved = true; stage.classList.add('drag');
  if (ptrs.size === 1) { view.x += dx; view.y += dy; }
  p.x = e.clientX; p.y = e.clientY;
  if (ptrs.size === 2 && pinch) { const [a, b] = [...ptrs.values()]; zoomAt((a.x + b.x) / 2, (a.y + b.y) / 2, pinch.k * Math.hypot(a.x - b.x, a.y - b.y) / pinch.d / view.k); }
  applyView();
});
const up = (e) => { ptrs.delete(e.pointerId); if (ptrs.size < 2) pinch = null; if (!ptrs.size) stage.classList.remove('drag'); };
window.addEventListener('pointerup', up); window.addEventListener('pointercancel', up);
// a drag that ends on a node must not select it
stage.addEventListener('click', (e) => { if (moved) { e.stopPropagation(); moved = false; } }, true);
function zoomAt(cx, cy, f) { const r = svg.getBoundingClientRect(), k = Math.min(2.5, Math.max(0.04, view.k * f)), x = cx - r.left, y = cy - r.top; view.x = x - (x - view.x) * (k / view.k); view.y = y - (y - view.y) * (k / view.k); view.k = k; applyView(); }
stage.addEventListener('wheel', (e) => { e.preventDefault(); zoomAt(e.clientX, e.clientY, Math.exp(-e.deltaY * 0.0015)); }, { passive: false });
svg.addEventListener('click', () => { if (sel) { sel = null; render(); panel(); } });

/* ---- controls ---- */
function setDepth(k) { all.forEach((n) => { n.open = n.depth < k; }); render(); fit(); }
document.querySelectorAll('[data-depth]').forEach((b) => b.addEventListener('click', () => { if (matches) clearSearch(); setDepth(Number(b.dataset.depth)); }));
document.getElementById('bFit').addEventListener('click', fit);
const bI = document.getElementById('bIssues');
bI.addEventListener('click', () => { showIssues = bI.getAttribute('aria-pressed') !== 'true'; bI.setAttribute('aria-pressed', showIssues); if (showIssues) all.forEach((n) => { if (n.children.length && hasIssueBelow(n)) n.open = true; }); render(); fit(); });

function clearSearch() { if (saved) all.forEach((n) => { n.open = saved.get(n.id); }); saved = null; matches = null; query = ''; document.getElementById('q').value = ''; }
document.getElementById('q').addEventListener('input', (e) => {
  const q = e.target.value.trim().toLowerCase();
  sel = null; panel();
  if (!q) { clearSearch(); render(); fit(); return; }
  if (!saved) saved = new Map(all.map((n) => [n.id, n.open]));
  all.forEach((n) => { n.open = false; });
  TREE.open = true;
  const m = new Set(); m.anc = new Set();
  for (const n of all) if (n.depth && `${n.label} ${n.sub || ''} ${n.desc || ''}`.toLowerCase().includes(q)) { m.add(n); for (let p = n.parent; p; p = p.parent) { p.open = true; m.anc.add(p); } }
  matches = m;
  render(); fit();
  countEl.textContent += ` · ${m.size} match${m.size === 1 ? '' : 'es'}`;
});
window.addEventListener('resize', fit);

render(); panel(); fit(); pullNotes();
</script>
</body>
